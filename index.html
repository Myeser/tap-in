<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 tap in 🔥</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(120deg, #ff3b3b, #ff9f1c, #ffe14d, #3ddc84, #2fb5ff, #8a5cff, #ff4fd8, #ff3b3b);
      background-size: 400% 400%;
      animation: rainbow 6s linear infinite;
      color: #fff;
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 3.2rem;
      margin: 0 0 1.5rem;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      animation: wiggle 1.2s ease-in-out infinite;
    }
    .cat {
      position: fixed;
      top: 17%;
      right: -3%;
      width: 160px;
      max-width: 42vw;
      transform: rotate(12deg);
    }
    .dance {
      position: fixed;
      top: 63%;
      right: 6%;
      width: 135px;
      max-width: 36vw;
      transform: rotate(-7deg);
    }
    .dog {
      position: fixed;
      top: 4%;
      left: 7%;
      width: 120px;
      max-width: 32vw;
      border: 6px solid #fff;
      border-bottom-width: 22px;
      box-shadow: 4px 4px 0 #000;
      transform: rotate(-9deg);
      animation: sway 2.5s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(-3deg); }
    }
    a {
      color: #000;
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      position: relative;
      z-index: 2;
    }
    .goblin {
      position: fixed;
      bottom: -10px;
      left: -10px;
      width: 150px;
      transform-origin: bottom center;
      animation: bob 1.6s ease-in-out infinite;
    }
    .sparkle {
      position: fixed;
      font-size: 1.6rem;
      animation: twinkle 1.5s ease-in-out infinite;
    }
    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }
    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <span class="sparkle" style="top:6%;right:14%">✨</span>
  <span class="sparkle" style="top:33%;left:10%;animation-delay:.5s">⭐</span>
  <span class="sparkle" style="top:27%;left:52%;animation-delay:.8s">🍄</span>
  <span class="sparkle" style="top:58%;left:18%;animation-delay:1s">✨</span>
  <span class="sparkle" style="top:88%;left:58%;animation-delay:.3s">⭐</span>
  <img src="assets/mcdonalds-dog.jpg" alt="mcdonalds dog" class="dog">

  <img src="assets/spinning-cat.gif" alt="spinning cat" class="cat">
  <h1>🔥 tap in 🔥</h1>
  <a href="https://instagram.com/myeserole">open insta</a>
  <img src="assets/dancing-cat.gif" alt="dancing cat" class="dance">

  <svg class="goblin" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- ears -->
    <path d="M45 95 L0 55 L55 80 Z" fill="#6fbf3a" stroke="#1f3d10" stroke-width="4" stroke-linejoin="round"/>
    <path d="M155 95 L200 50 L145 80 Z" fill="#6fbf3a" stroke="#1f3d10" stroke-width="4" stroke-linejoin="round"/>
    <path d="M40 88 L15 65 L50 80 Z" fill="#e88a9a"/>
    <path d="M160 88 L185 62 L150 80 Z" fill="#e88a9a"/>
    <!-- body -->
    <ellipse cx="100" cy="200" rx="60" ry="40" fill="#8a5a2b" stroke="#1f3d10" stroke-width="4"/>
    <!-- head -->
    <ellipse cx="100" cy="115" rx="58" ry="52" fill="#7fd14a" stroke="#1f3d10" stroke-width="4"/>
    <!-- warts -->
    <circle cx="65" cy="95" r="4" fill="#5aa22c"/>
    <circle cx="140" cy="135" r="3" fill="#5aa22c"/>
    <!-- googly eyes (different sizes) -->
    <circle cx="78" cy="105" r="18" fill="#fff" stroke="#1f3d10" stroke-width="3"/>
    <circle cx="126" cy="100" r="13" fill="#fff" stroke="#1f3d10" stroke-width="3"/>
    <circle cx="84" cy="110" r="8" fill="#000"/>
    <circle cx="122" cy="97" r="6" fill="#000"/>
    <!-- nose -->
    <path d="M100 112 Q118 128 102 134 Q92 130 100 112 Z" fill="#5aa22c" stroke="#1f3d10" stroke-width="3"/>
    <!-- grin with one tooth -->
    <path d="M68 140 Q100 168 135 138" fill="#3a1010" stroke="#1f3d10" stroke-width="4" stroke-linecap="round"/>
    <rect x="92" y="145" width="10" height="11" rx="2" fill="#fffbe0" stroke="#1f3d10" stroke-width="2"/>
    <!-- tiny party hat -->
    <path d="M85 68 L104 18 L120 66 Z" fill="#ff4fd8" stroke="#1f3d10" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="104" cy="18" r="7" fill="#ffe14d" stroke="#1f3d10" stroke-width="3"/>
  </svg>

  <script>
    setTimeout(() => {
      location.href = "https://instagram.com/myeserole";
    }, 2000);
  </script>
</body>
</html>
